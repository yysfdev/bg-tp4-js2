<!DOCTYPE html>
<html lang="fr">
<head>

    <title>Étape 3 - Tableau d'objets</title>

    <script src="script.js" defer></script>
</head>
<body>
    <div id="table_container">
        <table>
            <thead>
                <tr>
                    <th>N°</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Points</th>
                    <th>Select</th>
                </tr>

            <tbody id="table_body">
            </tbody>
        </table>
        <button onclick="doInsertRowTable(99, 'nom', 'prenom', 10)">Ajouter</button>
        <!-- Événement click : exécute consoleTableau() (slides 130 et 133) -->
        <button onclick="consoleTableau()">Console Tableau</button>
    </div>
